<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' - NorthPaw'">NorthPaw</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header th:fragment="nav">
  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" th:href="@{/}">NorthPaw Distributors</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <form class="d-flex flex-grow-1 my-2 my-md-0 mx-md-3" role="search" method="get" th:action="@{/products}">
          <input class="form-control me-2" type="search" name="q" placeholder="Search by product, brand or SKU" aria-label="Search">
          <button class="btn btn-outline-light" type="submit">Search</button>
        </form>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/about}">About</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/centres}">Distribution Centres</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/products}">Products</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/products/new}">Add Product</a></li>
        </ul>
      </div>
    </div>
  </nav>
</header>
<footer th:fragment="footer" class="text-center text-muted py-4 mt-5 border-top">
  <small>NorthPaw Distributors</small>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</body>
</html>
