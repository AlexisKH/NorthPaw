<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Home')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>

<main class="container py-5">
  <section>
    <h1 class="display-4 fw-bold">Everything pets need.</h1>
    <p class="lead">
      NorthPaw supplies pet stores with <span th:text="${productCount}">0</span> products
      from <span th:text="${brandCount}">0</span> brands.
    </p>
    <a class="btn btn-dark me-2" th:href="@{/products}">Shop products</a>
    <a class="btn btn-outline-dark" th:href="@{/products/new}">Add a product</a>
  </section>

  <section class="mt-5">
    <h2 class="h4">Shop by department</h2>
    <div class="row g-3">
      <div class="col-6 col-md-4 col-lg-2" th:each="type : ${petTypes}">
        <div class="card text-center">
          <div class="card-body">
            <h3 class="h5" th:text="${type.name}">Dog</h3>
            <a class="btn btn-sm btn-secondary" th:href="@{/products(petTypeId=${type.id})}">View</a>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
