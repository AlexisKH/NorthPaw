<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Distribution Centres')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>

<main class="container py-4">
  <h1>Distribution Centres</h1>
  <p>Every pet store we supply is served by its nearest distribution centre.</p>
  <div class="row g-3">
    <div class="col-md-4" th:each="c : ${centres}">
      <div class="card h-100"><div class="card-body">
        <h2 class="h5" th:text="${c.name}">Name</h2>
        <p class="mb-0"><span th:text="${c.address}">Address</span><br>
           <span th:text="${c.city} + ', ' + ${c.province}">City, ON</span></p>
      </div></div>
    </div>
  </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
